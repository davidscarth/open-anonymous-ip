name: Build
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Fetch lists
        run: |
          mkdir -p lists plus
          # sightings, cmd/sightings, turns the feeds and the proxy lists' git
          # histories into the lists below.
          go build -o sightings ./cmd/sightings
          curl -fsSL https://check.torproject.org/torbulkexitlist -o lists/torproject-exits.txt
          curl -fsSL 'https://onionoo.torproject.org/details?flag=Exit&fields=or_addresses' -o onionoo.json
          ./sightings onionoo -in onionoo.json -out lists/onionoo-exits-ipv6.txt
          curl -fsSL https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt -o lists/x4bnet-datacenter-ipv4.txt
          curl -fsSL https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv6.txt -o lists/x4bnet-datacenter-ipv6.txt
          curl -fsSL https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt -o lists/x4bnet-vpn-ipv4.txt
          curl -fsSL https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv6.txt -o lists/x4bnet-vpn-ipv6.txt
          curl -fsSL https://mask-api.icloud.com/egress-ip-ranges.csv -o lists/apple-private-relay.csv
          curl -fsSL https://www.gstatic.com/vpn/geofeed -o lists/google-vpn.csv
          # Google's own services (crawlers, DNS, mail) are everything Google announces
          # minus Google Cloud, by Google's own definition of the two feeds.
          curl -fsSL https://www.gstatic.com/ipranges/goog.json -o goog.json
          curl -fsSL https://www.gstatic.com/ipranges/cloud.json -o cloud.json
          ./sightings google -goog goog.json -cloud cloud.json -out lists/google-own.txt
          # The prefixes of the ASNs ipverse classifies as ISPs, read from the two
          # repositories without a checkout. They decide which proxy addresses are
          # residential and are not inserted themselves.
          git clone --quiet --depth 1 --no-checkout https://github.com/ipverse/as-metadata ipverse-as-metadata
          git clone --quiet --depth 1 --no-checkout https://github.com/ipverse/as-ip-blocks ipverse-as-ip-blocks
          ./sightings isp -metadata ipverse-as-metadata -blocks ipverse-as-ip-blocks -out lists/ipverse-isp.txt
          # Open proxies from every snapshot IPLocate and stormsia commit, folded
          # into one history per address: the last 14 days as one list for the
          # base file, and for the Plus file every address of the last 30 days in
          # a file per last-listed day and confidence. The confidence is the
          # methodology's table: how often addresses with this age and this many
          # distinct listed days in the window were listed again within 14 days,
          # rounded to 99, 70, 50, 30, or 10. Addresses on an ISP network and not
          # in a hosting range are written to the residential lists as well.
          git clone --quiet --shallow-since=30.days https://github.com/iplocate/free-proxy-list proxies-iplocate
          git clone --quiet --shallow-since=30.days https://github.com/stormsia/proxy-list proxies-stormsia
          ./sightings history -iplocate proxies-iplocate -stormsia proxies-stormsia \
            -hosting lists/x4bnet-datacenter-ipv4.txt -hosting lists/x4bnet-datacenter-ipv6.txt \
            -isp lists/ipverse-isp.txt -out lists -plus plus
          wc -l lists/* plus/*
          if grep -qE '/[0-7]$' lists/*-ipv4.txt || grep -qE '/([0-9]|1[0-9])$' lists/*-ipv6.txt \
            || grep -qiE '^::ffff:[0-9a-f.:]+/(9[6-9]|10[0-3])$' lists/*-ipv6.txt \
            || grep -qE '^[0-9.]+/[0-7],' lists/apple-private-relay.csv || grep -qE '^[0-9a-f:]+/([0-9]|1[0-9]),' lists/apple-private-relay.csv \
            || grep -qE '^[0-9.]+/[0-7]$' lists/google-own.txt || grep -qE '^[0-9a-f:]+/([0-9]|1[0-9])$' lists/google-own.txt \
            || grep -qE '^[0-9.]+/[0-7],' lists/google-vpn.csv || grep -qE '^[0-9a-f:]+/([0-9]|1[0-9]),' lists/google-vpn.csv; then
            echo "a list carries a network wider than /8 or /20"; exit 1
          fi
          for f in torproject-exits.txt:250 onionoo-exits-ipv6.txt:500 x4bnet-datacenter-ipv4.txt:9000 x4bnet-datacenter-ipv6.txt:1750 x4bnet-vpn-ipv4.txt:2200 x4bnet-vpn-ipv6.txt:100 public-proxy.txt:1000 residential.txt:500 ipverse-isp.txt:10000 apple-private-relay.csv:10000 google-vpn.csv:500 google-own.txt:50; do
            test "$(wc -l < "lists/${f%%:*}")" -ge "${f##*:}" || { echo "lists/${f%%:*} is too short"; exit 1; }
          done
          test "$(cat plus/*.txt | wc -l)" -ge 200 || { echo "plus/ proxy lists are too short"; exit 1; }

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: |
          go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o open-anonymous-ip .
          # -skip-reserved: the proxy union has carried a loopback address; it drops
          # reserved entries from every list rather than stopping the build.
          # Lists apply in command-line order and the last writer wins per field,
          # so the excludes come before the proxy and Tor lists, which keep their
          # flags inside a carved-out range, and Tor, the freshest source, is last.
          ./open-anonymous-ip -skip-reserved \
            -hosting lists/x4bnet-datacenter-ipv4.txt -hosting lists/x4bnet-datacenter-ipv6.txt \
            -vpn lists/x4bnet-vpn-ipv4.txt -vpn lists/x4bnet-vpn-ipv6.txt \
            -exclude lists/apple-private-relay.csv -exclude lists/google-vpn.csv -exclude lists/google-own.txt \
            -public_proxy lists/public-proxy.txt -residential_proxy lists/residential.txt \
            -tor lists/torproject-exits.txt -tor lists/onionoo-exits-ipv6.txt \
            -o open-anonymous-ip.mmdb > build.txt
          cat build.txt
          sha256sum open-anonymous-ip.mmdb > open-anonymous-ip.mmdb.sha256
          # Plus: the same lists with anonymizer_confidence and network_last_seen.
          # Each proxy file carries its date and confidence in its name, and the
          # glob orders them oldest first, public proxy before residential. Tor
          # exits are today's at 99, the Tor Project checked them within the hour.
          proxies=()
          for f in plus/public-proxy-*.txt plus/residential-*.txt; do
            base=${f#plus/}; base=${base%.txt}
            d=${base%-c*}; d=${d: -10}
            c=${base##*-c}
            case $base in public-proxy-*) flag=-public_proxy;; *) flag=-residential_proxy;; esac
            proxies+=(-seen "$d" -confidence "$c" "$flag" "$f")
          done
          ./open-anonymous-ip -plus -skip-reserved \
            -hosting lists/x4bnet-datacenter-ipv4.txt -hosting lists/x4bnet-datacenter-ipv6.txt \
            -vpn lists/x4bnet-vpn-ipv4.txt -vpn lists/x4bnet-vpn-ipv6.txt \
            -exclude lists/apple-private-relay.csv -exclude lists/google-vpn.csv -exclude lists/google-own.txt \
            "${proxies[@]}" \
            -seen "$(date -u +%F)" -confidence 99 -tor lists/torproject-exits.txt -tor lists/onionoo-exits-ipv6.txt \
            -o open-anonymous-ip-plus.mmdb > build-plus.txt
          cat build-plus.txt
          sha256sum open-anonymous-ip-plus.mmdb > open-anonymous-ip-plus.mmdb.sha256

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          # One line per proxy day-file is noise in the notes, so the
          # plus/ lines are rolled up to one line per list and confidence.
          # The full list stays in the Build step's log.
          ./sightings notes -in build-plus.txt > build-plus-notes.txt
          printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n\n```\n%s\n```\n' \
            "Rebuilt daily from the Tor Project exit lists, X4BNet's datacenter and VPN lists, and the IPLocate and stormsia proxy lists. open-anonymous-ip.mmdb is the six-flag Anonymous IP layout, open-anonymous-ip-plus.mmdb the Anonymous Plus layout with a 30-day proxy window and a confidence per address. See the README for what each flag means and where the data comes from, and NOTICE for the data licenses." \
            "Built by open-anonymous-ip $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%M:%SZ)." \
            "$(cat build.txt)" \
            "Plus:" \
            "$(cat build-plus-notes.txt)" > notes.md
          gh release view latest >/dev/null 2>&1 || gh release create latest --title Latest --notes-file notes.md
          gh release edit latest --title "$(date -u +%Y-%m-%d)" --latest --notes-file notes.md
          gh release upload latest open-anonymous-ip.mmdb open-anonymous-ip.mmdb.sha256 open-anonymous-ip-plus.mmdb open-anonymous-ip-plus.mmdb.sha256 NOTICE --clobber
